name: 24-7 Cloud AI Scalp Runner

on:
  schedule:
    # Runs every 5 minutes (maximum frequency permitted by GitHub Actions cron)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-scalp-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Trader-Pro Scalp Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Calling Vercel AI Scalp Engine (15M)..."
          curl -fsS --max-time 30 -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://trader-pro-dashboard.vercel.app/api/cron/scalp"
          echo "Calling Vercel AI Paper 1H-A Executor..."
          curl -fsS --max-time 30 -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://trader-pro-dashboard.vercel.app/api/cron/paper-1h-a"
