name: 24-7 Cloud AI Scalp Runner

on:
  schedule:
    # Runs every 5 minutes (maximum frequency permitted by GitHub Actions cron)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-scalp-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Trader-Pro Scalp Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Calling Vercel AI Scalp Engine (15M)..."
          curl -fsS --max-time 30 -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://trader-pro-dashboard.vercel.app/api/cron/scalp"
          echo "Calling Vercel AI Paper 1H-A Executor..."
          curl -fsS --max-time 30 -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://trader-pro-dashboard.vercel.app/api/cron/paper-1h-a"

      - name: Notify on Failure (Telegram / Discord)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Sending automated failure alerts..."
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -X POST -H "Content-Type: application/json" \
              -d '{"content":"🚨 **Trader-Pro Cloud Cron Alert**: Scheduled trading loop failed or encountered an unauthorized HTTP status on Vercel."}' \
              "$DISCORD_WEBHOOK_URL" || true
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="🚨 Trader-Pro Cloud Cron Alert: Scheduled trading loop failed or encountered an unauthorized HTTP status on Vercel." || true
          fi
