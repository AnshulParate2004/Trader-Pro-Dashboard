name: Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Production Unit Tests
        run: npm test

      - name: Next.js Production Build
        run: npm run build
        env:
          AUTH_SECRET: "ci_build_verification_auth_secret_minimum_32_chars"
          AUTH_PASSWORD_HASH: "$2b$10$ci_build_dummy_hash_for_type_checking"
          CRON_SECRET: "ci_build_cron_secret"

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=critical
